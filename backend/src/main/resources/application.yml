spring:
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/ORCLPDB}
    username: ${DB_USERNAME:library_etl}
    password: ${DB_PASSWORD:library_etl}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:oracle.jdbc.OracleDriver}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

server:
  port: ${PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:}
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    cookie-secure: ${JWT_COOKIE_SECURE:true}

members:
  procedure:
    schema: library_etl
